<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | EventHub
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">
        Event<span>Hub</span>
    </a>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/events">
            Events
        </a>

    </div>

</nav>


<section class="login-section">

    <div class="login-card">

        <div class="logo">
            Event<span>Hub</span>
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="login-subtitle">
            Sign in to manage your event system.
        </p>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="primary-btn"
                style="width:100%;">

                Login to Dashboard

            </button>

        </form>


        <div class="demo-box">

            <strong>
                Demo Login
            </strong>

            <br>

            Username:
            <b>admin</b>

            <br>

            Password:
            <b>admin123</b>

        </div>


        <div
            style="
                text-align:center;
                margin-top:20px;
            ">

            <a
                href="/"
                style="
                    color:#6255ff;
                    font-size:14px;
                    font-weight:bold;
                ">

                ← Back to EventHub

            </a>

        </div>

    </div>

</section>


</body>

</html>
